  - id: power-delivery
    label: "Power delivery and grid infrastructure"
  - id: foundry-capacity
    label: "Foundry and fab capacity expansion"
  - id: edge-ai
    label: "Edge AI / on-device inference"
  - id: agentic-software
    label: "Agentic AI software platforms"
  - id: quantum-computing
    label: "Quantum computing"
  - id: robotics-automation
    label: "Robotics and physical automation"
  - id: analog-mixed-signal
    label: "Analog / mixed-signal semiconductors"
  - id: memory-storage
    label: "Memory and storage"
  - id: hyperscaler-capex
    label: "Hyperscaler capital expenditure cycle"
  - id: export-controls
