# Theme taxonomy - arc42 5.4 Channel A `theme_claims[].theme_id`, versioned as
# `taxonomy_version` and part of the extraction cache key (content_hash + model_version
# + prompt_version + schema_version + taxonomy_version). Changing this file invalidates
# the extraction cache and triggers controlled re-extraction.
schema_version: "4.0"
config_type: taxonomy
taxonomy_version: themes-2026-08

themes:
