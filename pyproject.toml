[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "auspex"
version = "4.2.0"
description = "Auspex - regulated-AI financial research MVP"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "Auspex contributors" }]

dependencies = [
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "fastapi>=0.111,<1",
    "uvicorn[standard]>=0.30,<1",
    "httpx>=0.27,<1",
    "aiohttp>=3.9,<4",
    "PyYAML>=6.0,<7",
    "python-dateutil>=2.9,<3",
    "PyJWT[crypto]>=2.8,<3",
    "cryptography>=42",
    "azure-identity>=1.16,<2",
    "azure-keyvault-secrets>=4.8,<5",
    "azure-cosmos>=4.6,<5",
    "azure-storage-blob>=12.19,<13",
    "openai>=1.30,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<10",
    "pytest-asyncio>=1.4.0,<2",
    "ruff>=0.12,<1",
]

[project.scripts]
auspex = "auspex.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["auspex*"]

[tool.setuptools.package-data]
auspex = ["py.typed"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "B008",   # FastAPI's `Depends(...)` in argument defaults is the idiomatic DI pattern
    "UP046",  # Generic[T] subclassing is intentional here (repositories predate PEP 695 style)
]
