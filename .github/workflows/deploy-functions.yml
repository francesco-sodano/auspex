name: Deploy Function Apps

# Disabled until E10. The supported E1-E4 deployment path is the manual/local
# package upload procedure in doc/operations.md.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'dev'
        type: choice
        options: [dev, prod]

permissions:
  id-token: write
  contents: read

jobs:
  deploy-dev:
    name: Deploy Functions to dev
    if: ${{ false }} # Disabled until E10 CI/CD automation is enabled.
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Future E10 deployment method
        run: |
          echo "Disabled until E10. Do not use Azure Functions Core Tools publish in this subscription."
          echo "Future method: build a package, upload it to the Function storage account with OIDC bearer auth, generate a user-delegation SAS, and set WEBSITE_RUN_FROM_PACKAGE via ARM REST."

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deployment disabled until E10
        run: echo "Use doc/operations.md for the current manual/local Function App deployment path."

  deploy-prod:
    name: Deploy Functions to prod
    if: ${{ false }} # Disabled until E10 CI/CD automation is enabled.
    runs-on: ubuntu-latest
    environment: prod

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Future E10 deployment method
        run: |
          echo "Disabled until E10. Do not use Azure Functions Core Tools publish in this subscription."
          echo "Future method: build a package, upload it to the Function storage account with OIDC bearer auth, generate a user-delegation SAS, and set WEBSITE_RUN_FROM_PACKAGE via ARM REST."

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deployment disabled until E10
        run: echo "Use doc/operations.md for the current manual/local Function App deployment path."
