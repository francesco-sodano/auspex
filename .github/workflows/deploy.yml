name: Deploy

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: auspex-${{ vars.AZD_ENVIRONMENT_NAME || 'prod' }}
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    environment: prod
    timeout-minutes: 120
    env:
      AZURE_ENV_NAME: ${{ vars.AZD_ENVIRONMENT_NAME || 'prod' }}
    steps:
      - uses: actions/checkout@v4
      - uses: Azure/setup-azd@v2
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Authenticate Azure Developer CLI
        run: |
          azd auth login \
            --client-id "${{ vars.AZURE_CLIENT_ID }}" \
            --tenant-id "${{ vars.AZURE_TENANT_ID }}" \
            --federated-credential-provider github
      - name: Configure deployment environment
        env:
          AUSPEX_PRICE_API_KEY: ${{ secrets.AUSPEX_PRICE_API_KEY }}
          AUSPEX_NEWS_API_KEY: ${{ secrets.AUSPEX_NEWS_API_KEY }}
        run: |
          test -n "${{ vars.AUSPEX_AUTH_TENANT_ID }}"
          test -n "${{ vars.AUSPEX_AUTH_CLIENT_ID }}"
          test -n "${{ vars.AUSPEX_OWNER_OBJECT_ID }}"
          azd env new "${AZURE_ENV_NAME}" --no-prompt
          azd env set AZURE_SUBSCRIPTION_ID "${{ vars.AZURE_SUBSCRIPTION_ID }}"
          azd env set AZURE_LOCATION "${{ vars.AZURE_LOCATION }}"
          azd env set AZURE_OPENAI_LOCATION "${{ vars.AZURE_OPENAI_LOCATION }}"
          azd env set AUSPEX_PYPI_INDEX_URL "${{ vars.AUSPEX_PYPI_INDEX_URL || 'https://pypi.org/simple' }}"
          azd env set AUSPEX_AUTH_TENANT_ID "${{ vars.AUSPEX_AUTH_TENANT_ID }}"
          azd env set AUSPEX_AUTH_CLIENT_ID "${{ vars.AUSPEX_AUTH_CLIENT_ID }}"
          azd env set AUSPEX_OWNER_OBJECT_ID "${{ vars.AUSPEX_OWNER_OBJECT_ID }}"
          azd env set AUSPEX_ALERT_EMAIL "${{ vars.AUSPEX_ALERT_EMAIL }}"
          azd env set AUSPEX_EDGAR_USER_AGENT "${{ vars.AUSPEX_EDGAR_USER_AGENT }}"
          azd env set AUSPEX_PRICE_API_KEY "${AUSPEX_PRICE_API_KEY}"
          azd env set AUSPEX_NEWS_API_KEY "${AUSPEX_NEWS_API_KEY}"
          azd env set AUSPEX_EXISTING_KEY_VAULT_NAME "${{ vars.AUSPEX_EXISTING_KEY_VAULT_NAME }}"
          azd env set AUSPEX_EXISTING_KEY_VAULT_RESOURCE_GROUP "${{ vars.AUSPEX_EXISTING_KEY_VAULT_RESOURCE_GROUP }}"
          azd env set AUSPEX_EXISTING_LEDGER_ACCOUNT_NAME "${{ vars.AUSPEX_EXISTING_LEDGER_ACCOUNT_NAME }}"
          azd env set AUSPEX_EXISTING_LEDGER_RESOURCE_GROUP "${{ vars.AUSPEX_EXISTING_LEDGER_RESOURCE_GROUP }}"
          azd env set AUSPEX_LEDGER_DATABASE_NAME "${{ vars.AUSPEX_LEDGER_DATABASE_NAME || 'auspex' }}"
          azd env set AUSPEX_MONTHLY_BUDGET "${{ vars.AUSPEX_MONTHLY_BUDGET || '165' }}"
          azd env set AUSPEX_EXTRACTION_MODEL_CAPACITY "${{ vars.AUSPEX_EXTRACTION_MODEL_CAPACITY || '200' }}"
          azd env set AUSPEX_NARRATIVE_MODEL_CAPACITY "${{ vars.AUSPEX_NARRATIVE_MODEL_CAPACITY || '30' }}"
          azd env set AUSPEX_MANAGE_ENTRA_REDIRECT_URI "${{ vars.AUSPEX_MANAGE_ENTRA_REDIRECT_URI || 'true' }}"
      - name: Provision and deploy
        run: azd up --no-prompt
      - name: Verify endpoint
        run: |
          URI="$(azd env get-value SERVICE_API_URI)"
          curl --fail --retry 20 --retry-all-errors "${URI}/healthz"
          STATUS="$(curl --silent --show-error --output /tmp/unauthenticated.json \
            --write-out '%{http_code}' "${URI}/api/securities")"
          test "${STATUS}" = "401"
