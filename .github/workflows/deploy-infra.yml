name: Deploy Infrastructure

# Disabled until E10. The supported E1-E4 deployment path is the manual/local
# procedure in doc/operations.md.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'dev'
        type: choice
        options: [dev, prod]

permissions:
  id-token: write   # Required for OIDC login
  contents: read

jobs:
  # -------------------------------------------------------------------------
  # Deploy to dev automatically on push; deploy to prod only on manual trigger
  # with environment approval gate.
  # -------------------------------------------------------------------------

  deploy-dev:
    name: Deploy to dev
    if: ${{ false }} # Disabled until E10 CI/CD automation is enabled.
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Lint Bicep
        run: az bicep build --file infra/main.bicep

      - name: Deploy infra (dev)
        run: |
          az deployment sub create \
            --name "auspex-dev-$(date +%Y%m%d%H%M%S)" \
            --location switzerlandnorth \
            --template-file infra/main.bicep \
            --parameters @infra/params/dev.json \
            --verbose

  deploy-prod:
    name: Deploy to prod
    if: ${{ false }} # Disabled until E10 CI/CD automation is enabled.
    runs-on: ubuntu-latest
    environment: prod   # prod environment has required reviewers configured in GitHub

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Lint Bicep
        run: az bicep build --file infra/main.bicep

      - name: Deploy infra (prod)
        run: |
          az deployment sub create \
            --name "auspex-prod-$(date +%Y%m%d%H%M%S)" \
            --location switzerlandnorth \
            --template-file infra/main.bicep \
            --parameters @infra/params/prod.json \
            --verbose
