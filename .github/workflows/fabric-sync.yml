      #     WORKSPACE_ID="${{ vars.FABRIC_WORKSPACE_ID }}"
      #     TOKEN="${{ secrets.FABRIC_WORKSPACE_TOKEN }}"
      #     curl -s -X POST \
      #       "https://api.fabric.microsoft.com/v1/workspaces/${WORKSPACE_ID}/git/updateFromGit" \
      #       -H "Authorization: Bearer ${TOKEN}" \
